<div class="controls"><button id="play" class="play" type="button" aria-label="暂停动画" aria-pressed="false"><svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path id="playIcon" d="M5 4h3v12H5zm7 0h3v12h-3z"/></svg></button><div class="status"><strong id="status">出发，去吹吹风</strong><small>NO PLANS. JUST GOOD VIBES.</small></div><span class="rule"></span><label class="speed" for="speed">兜风速度 <input id="speed" type="range" min="0.4" max="2" value="1" step="0.1"><output id="speedValue" for="speed">1.0×</output></label><button id="wave" class="wave" type="button"><span aria-hidden="true">✦</span>和棕熊打个招呼</button></div>

</main>
<script>
(() => {
 const $=id=>document.getElementById(id),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 let running=!reduced,speed=1,time=0,last=null,waveTime=0;
 const cloneLoop=id=>{const item=$(id),copy=item.cloneNode(true);copy.removeAttribute('id');item.after(copy);return copy};
 const cloudsCopy=cloneLoop('clouds'),treesCopy=cloneLoop('trees'),vergeCopy=cloneLoop('verge');
 function loop(id,copy,rate,width){const x=time*rate%width;$(id).setAttribute('transform',`translate(${-x} 0)`);copy.setAttribute('transform',`translate(${width-x} 0)`)}
 function updatePlay(){$('play').setAttribute('aria-label',running?'暂停动画':'播放动画');$('play').setAttribute('aria-pressed',String(!running));$('playIcon').setAttribute('d',running?'M5 4h3v12H5zm7 0h3v12h-3z':'M6 3l11 7-11 7z');$('status').textContent=running?'出发，去吹吹风':'停一停，看看风景'}
 $('play').addEventListener('click',()=>{running=!running;updatePlay()});
 $('speed').addEventListener('input',e=>{speed=Number(e.target.value);$('speedValue').value=speed.toFixed(1)+'×'});
 $('wave').addEventListener('click',()=>{waveTime=3;$('greeting').classList.add('visible')});
 document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();$('play').click()}});
 function render(now){
  const dt=last===null?0:Math.min((now-last)/1000,.05);last=now;
  if(!document.hidden){if(running)time+=dt*speed;waveTime=Math.max(0,waveTime-dt)}
  const bounce=Math.sin(time*8)*1.4+Math.sin(time*4)*.7,deg=time*200;
  $('car').setAttribute('transform',`translate(0 ${bounce}) rotate(${Math.sin(time*4)*.18} 600 487)`);
  $('backWheel').setAttribute('transform',`translate(451 487) rotate(${deg})`);$('frontWheel').setAttribute('transform',`translate(749 487) rotate(${deg})`);
  $('head').setAttribute('transform',`rotate(${Math.sin(time*3)*1.1} 570 300)`);
  $('scarf').setAttribute('d',`M551 300q-39 ${-10+Math.sin(time*8)*5}-70 ${-4+Math.sin(time*7)*5}l5 10-12 11q42 ${7+Math.sin(time*7)*4}76-4Z`);
  $('wavingArm').setAttribute('transform',`rotate(${waveTime>0&&!reduced?Math.sin(waveTime*15)*13:0} 550 331)`);
  $('greeting').classList.toggle('visible',waveTime>0);
  $('lane').setAttribute('patternTransform',`translate(${-time*170%240} 0)`);
  loop('clouds',cloudsCopy,7,1400);loop('trees',treesCopy,45,1400);loop('verge',vergeCopy,170,1400);
  requestAnimationFrame(render);
 }
 updatePlay();requestAnimationFrame(render);
})();
</script></body></html>
